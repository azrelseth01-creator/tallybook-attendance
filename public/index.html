<!doctype html>
<html lang="en" data-desk="navy" data-paper="ruled" data-density="comfy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tallybook: class attendance</title>
  <meta name="description" content="Tallybook is a class attendance register for teachers: roll call, absence tallies, a calendar, reports and a printable monthly register.">
  <meta name="theme-color" content="#16214d">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@500;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/shell.css">
  <link rel="stylesheet" href="/assets/css/loader.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/views.css">
  <link rel="stylesheet" href="/assets/css/library.css">
  <link rel="stylesheet" href="/assets/css/print.css" media="print">
</head>
<body>
  <!-- roughens the edges of the rubber-stamp marks -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter></svg>
  <a class="skip" href="#view">Skip to the page</a>

  <!-- The loading screen. It is on the page from the first paint and is the intro; main.js drives the bar.
       It is also used when you open the Classes tab, open a class, or get the password right. -->
  <div id="loader" class="loader go" data-mode="intro" aria-busy="true">
    <div class="ld-card">
      <svg class="ld-tally" viewBox="0 0 112 76" aria-hidden="true" focusable="false">
        <path style="--i:0" pathLength="1" d="M20 8V64"/>
        <path style="--i:1" pathLength="1" d="M42 8V64"/>
        <path style="--i:2" pathLength="1" d="M64 8V64"/>
        <path style="--i:3" pathLength="1" d="M86 8V64"/>
        <path class="ld-strike" style="--i:4" pathLength="1" d="M5 56L106 18"/>
      </svg>
      <p class="hand ld-kicker" id="ldKicker">Class attendance register</p>
      <h2 class="ld-title" id="ldTitle">Tallybook</h2>
    </div>
    <div class="ld-meter">
      <div class="ld-track" id="ldBar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <i class="ld-fill"></i>
        <svg class="ld-pencil" viewBox="0 0 40 16" aria-hidden="true" focusable="false"><path d="M0 8L9 1.5V14.5z" fill="#f3d9b1" stroke="#1b2559" stroke-width="1.5" stroke-linejoin="round"/><path d="M0 8L3.2 5.7V10.3z" fill="#1b2559"/><path d="M9 1.5H32V14.5H9z" fill="#ffd84a" stroke="#1b2559" stroke-width="1.5"/><path d="M32 1.5H36.5Q39 1.5 39 4V12Q39 14.5 36.5 14.5H32z" fill="#ee5d6c" stroke="#1b2559" stroke-width="1.5"/><path d="M9 8H32" stroke="#1b2559" stroke-opacity=".35"/></svg>
      </div>
      <div class="ld-row"><span class="ld-sub" id="ldSub" role="status">Sharpening pencils…</span><span class="ld-pct" aria-hidden="true"><b id="ldPct">0</b>%</span></div>
    </div>
  </div>
  <script>setTimeout(function(){var l=document.getElementById('loader');if(l&&!window.__tbLoader){l.hidden=true;document.body.insertAdjacentHTML('beforeend','<p style="padding:2rem;font-family:sans-serif;color:#fff">Tallybook is taking too long to start. Check your connection and reload the page.</p>')}},15000)</script>

  <!-- The book cover: the password screen. Nothing else loads until a password is accepted. -->
  <div id="cover" class="cover" hidden>
    <div class="cover-book">
      <div class="cover-label">
        <p class="hand" id="cvSchool"></p>
        <h1 id="cvTitle">Tallybook</h1>
        <p class="cover-class" id="cvClass"></p>
        <p class="hand" id="cvTeacher"></p>
      </div>
      <form id="cvForm" autocomplete="off">
        <div class="pin-entry" id="cvPinWrap" hidden><label class="pin-field" for="cvPin"><span>Password</span><input id="cvPin" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="off" aria-describedby="cvError"></label><button class="btn ghost small pin-reveal" id="cvReveal" type="button" aria-label="Show password" aria-pressed="false">Show</button></div>
        <p class="cover-hint" id="cvCaps" hidden>Caps Lock is on</p>
        <p class="cover-error" id="cvError" role="alert"></p>
        <button class="btn primary big" id="cvOpen" type="submit">Open the book</button>
      </form>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <nav class="rail" id="rail" aria-label="Main"></nav>
    <div class="sheet">
      <header class="titlebar">
        <div class="file">
          <svg class="file-ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h11a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
          <span class="file-name" id="tbFile"></span>
          <select id="tbClass" aria-label="Switch class" hidden></select>
        </div>
        <div class="tb-right">
          <span class="role-pill" id="tbRole" hidden></span>
          <span class="saved" id="tbSaved" role="status"></span>
          <button class="icon-btn" id="tbUndo" aria-label="Undo the last mark" title="Undo (Ctrl+Z)" disabled></button>
          <details class="more-wrap header-more" id="tbMoreMenu"><summary class="icon-btn" id="tbMore" aria-label="More options" title="More options"></summary><div class="more-menu" aria-label="More options"><button class="more-item" id="tbMusic" type="button"></button>
          <button class="more-item" id="tbHelp" type="button"></button></div></details>
          <button class="icon-btn" id="tbLock" aria-label="Lock the book" title="Lock the book (sign out)" hidden></button>
        </div>
      </header>
      <div class="ruler" id="ruler" aria-hidden="true"></div>
      <main id="view" class="page" tabindex="-1"></main>
    </div>
  </div>

  <!-- The class library: every class on one shelf, outside any single class -->
  <div id="library" class="lib" hidden></div>

  <aside id="musicDock" class="dock" data-open="false" data-engine="" hidden aria-label="Background music"></aside>
  <canvas id="vfx" aria-hidden="true"></canvas>
  <div id="toasts" aria-live="polite"></div>

  <noscript><p style="padding:2rem;font-family:sans-serif">Tallybook needs JavaScript to run. Please turn it on for this site.</p></noscript>
  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
